<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sleep</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    width: 100%; height: 100vh; height: 100dvh;
    overflow: hidden; touch-action: pan-y;
    -webkit-text-size-adjust: 100% !important;
  }

  body {
    background-color: #fcfdff; position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    display: flex; flex-direction: column; align-items: center;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  
  .blob { position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; pointer-events: none; }
  .b-top-left { width: 80vw; height: 80vw; top: -10vw; left: -20vw; background: #d4e6fa; opacity: 0.7; }
  .b-top-right { width: 75vw; height: 75vw; top: -10vw; right: -20vw; background: #e8defa; opacity: 0.6; }
  .b-bottom { width: 140vw; height: 80vw; bottom: 0; left: 50%; transform: translateX(-50%); background: #b8def7; opacity: 0.85; filter: blur(90px); }
  .b-light { width: 90vw; height: 60vw; bottom: 20vh; left: 5vw; background: #ffffff; opacity: 0.8; filter: blur(70px); }

  .header { width: 100%; max-width: 390px; padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 6px; color: #111; }
  .logo-img { width: 44px; height: 32px; background-image: url('logo.png'); background-size: contain; background-position: center; background-repeat: no-repeat; pointer-events: none; }
  .brand-name { font-family: "Courier New", Courier, monospace; font-weight: 900; font-size: 22px; letter-spacing: -1px; }

  .lang-container { position: relative; }
  .lang-btn { display: flex; align-items: center; gap: 4px; background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(255, 255, 255, 0.8); padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #333; cursor: pointer; backdrop-filter: blur(10px); }
  .lang-menu { position: absolute; top: calc(100% + 8px); right: 0; width: 180px; max-height: 200px; overflow-y: auto; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.25s; z-index: 20; }
  .lang-menu.active { opacity: 1; visibility: visible; transform: translateY(0); }
  .lang-menu::-webkit-scrollbar { width: 0; }
  .lang-item { padding: 8px 12px; font-size: 13px; color: #333; cursor: pointer; display: flex; gap: 6px; }

  .scroll-wrapper { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 0; }
  .scroll-wrapper::-webkit-scrollbar { display: none; }

  .login-card { position: relative; z-index: 5; width: min(92vw, 390px); background: #ffffff; border-radius: 20px; padding: 16px; box-shadow: 0 10px 30px -15px rgba(100, 130, 160, 0.15); flex-shrink: 0; transition: transform 0.1s; }

  @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .shake { animation: shake 0.4s ease-in-out; }

  .card-header { text-align: center; margin-bottom: 12px; }
  .card-header h1 { font-size: 20px; font-weight: 800; color: #111; margin-bottom: 2px; }
  .card-header p { font-size: 12px; color: #888; }

  .tabs { display: flex; background: #f4f5f7; border-radius: 10px; padding: 2px; margin-bottom: 12px; }
  .tab { flex: 1; text-align: center; padding: 6px 0; font-size: 13px; font-weight: 600; color: #888; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
  .tab.active { background: #fff; color: #111; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05); }

  .form-content { display: none; animation: fadeIn 0.2s ease; }
  .form-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .input-container { margin-bottom: 8px; position: relative; }
  .input-group { position: relative; }
  .input-group input { width: 100%; height: 40px; border: 1px solid #e5e7eb; border-radius: 10px; padding: 0 40px 0 12px; font-size: 14px; color: #111; outline: none; background: #fafbfc; transition: all 0.2s; -webkit-user-select: text; user-select: text; }
  .input-group input:focus { border-color: #7fb6dd; background: #fff; }
  .input-group input::placeholder { color: #b0b5bb; }
  .input-group input.error { border-color: #e53e3e; background: #fffafb; }

  .input-tips { font-size: 10px; color: #a0aab5; margin-top: 2px; padding-left: 4px; line-height: 1.2; transition: color 0.2s; }
  .input-tips.error-text { color: #e53e3e; }

  .eye-wrapper { position: absolute; right: 0; top: 0; height: 100%; width: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; }
  .eye-icon { width: 16px; height: 16px; stroke: #a0aab5; fill: none; stroke-width: 1.8; pointer-events: none; transition: stroke 0.2s; }
  .eye-icon .eye-slash { display: none; }
  .eye-wrapper.show-pwd .eye-slash { display: block; }
  .eye-wrapper.show-pwd .eye-icon { stroke: #111; }

  .checkbox-group { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #666; margin-bottom: 12px; margin-top: 2px;}
  .checkbox-group input[type="checkbox"] { width: 14px; height: 14px; accent-color: #111; cursor: pointer; }
  .checkbox-group a { color: #4d8ee4; text-decoration: none; }
  .checkbox-group.error-checkbox label { color: #e53e3e; }
  .checkbox-group.error-checkbox input[type=checkbox] { accent-color: #e53e3e; outline: 1px solid #e53e3e; border-radius: :2px; }

  .btn-submit { width: 100%; height: 40px; background: #000; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 12px; transition: transform 0.1s, background 0.2s; }
  .btn-submit:active { transform: scale(0.98); background #222; }

  .form-actions { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #666; margin-bottom: 12px; }
  .form-actions .checkbox-group { margin-bottom: 0; }
  .form-actions a { color: #4d8ee4; text-decoration: none; }

  .divider { display: flex; align-items: center; color: #b0b5bb; font-size: 11px; margin-bottom: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #eee; }
  .divider::before { margin-right: 8px; } .divider::after { margin-left: 8px; }

  .social-login { display: flex; gap: 8px; margin-bottom: 12px; }
  .social-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 40px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 13px; font-weight: 600; color: #111; cursor: pointer; }
  .social-btn svg { width: 16px; height: 16px; }

  .footer-text { text-align: center; font-size: 10px; color: #999; line-height: 1.3; }
  .footer-text a { color: #999; text-decoration: none; margin: 0 2px; }
</style>
</head>
<body>
  <div class="blob b-top-left"></div>
  <div class="blob b-top-right"></div>
  <div class="blob b-bottom"></div>
  <div class="blob b-light"></div>

  <header class="header">
    <div class="brand">
      <div class="logo-img"></div>
      <span class="brand-name">𝚂𝚕𝚎𝚎𝚙.</span>
    </div>
    <div class="lang-container">
      <div class="lang-btn" id="langBtn">
        <span id="currentFlag">🇨🇳</span>
        <span id="currentText">简体中文</span>
      </div>
      <div class="lang-menu" id="langMenu"></div>
    </div>
  </header>

  <div class="scroll-wrapper" id="scrollWrapper">
    <div class="login-card" id="cardContainer">
      <div class="card-header">
        <h1 id="pageTitle">欢迎回来</h1>
        <p id="pageSub">登录以继续访问 Sleep 平台</p>
      </div>

      <div class="tabs">
        <div class="tab active" id="tabLogin">登录</div>
        <div class="tab" id="tabRegister">注册</div>
      </div>

      <div class="form-content active" id="loginForm">
        <form id="formLogin" novalidate>
          <div class="input-container">
            <div class="input-group">
              <input type="text" id="loginUser" placeholder="请输入账号或邮箱">
            </div>
            <div class="input-tips" id="tipLoginUser" style="visibility: hidden;">账号格式错误</div>
          </div>
          <div class="input-container">
            <div class="input-group">
              <input type="password" id="loginPwd" class="pwd-input" placeholder="请输入密码">
              <div class="eye-wrapper">
                <svg class="eye-icon" viewBox="0 0 24 24"><path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle class="eye-open" cx="12" cy="12" r="3"/><line class="eye-slash" x1="3" y1="3" x2="21" y2="21"/></svg>
              </div>
            </div>
            <div class="input-tips" id="tipLoginPwd" style="visibility: hidden;">密码不能为空</div>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="agreeLogin">
            <label for="agreeLogin">我已阅读并同意 <a href="#">《服务条款》</a> 和 <a href="#">《隐私政策》</a></label>
          </div>
          <button type="submit" class="btn-submit">登 录</button>
          <div class="form-actions">
            <div class="checkbox-group">
              <input type="checkbox" id="remember">
              <label for="remember">记住我</label>
            </div>
            <a href="#">忘记密码?</a>
          </div>
        </form>
      </div>

      <div class="form-content" id="registerForm">
        <form id="formRegister" novalidate>
          <div class="input-container">
            <div class="input-group">
              <input type="text" id="regUser" placeholder="请设置账号 (用户名)">
            </div>
            <div class="input-tips" id="tipUser">支持 4-20 位字母、数字或下划线</div>
          </div>
          <div class="input-container">
            <div class="input-group">
              <input type="email" id="regEmail" placeholder="请输入邮箱地址">
            </div>
            <div class="input-tips" id="tipEmail">用于登录、找回密码及接收重要通知</div>
          </div>
          <div class="input-container">
            <div class="input-group">
              <input type="password" id="regPwd" class="pwd-input" placeholder="设置密码">
              <div class="eye-wrapper">
                <svg class="eye-icon" viewBox="0 0 24 24"><path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle class="eye-open" cx="12" cy="12" r="3"/><line class="eye-slash" x1="3" y1="3" x2="21" y2="21"/></svg>
              </div>
            </div>
            <div class="input-tips" id="tipPwd">需包含大小写字母、数字及符号，长度 8-20 位</div>
          </div>
          <div class="input-container">
            <div class="input-group">
              <input type="password" id="regPwdConfirm" class="pwd-input" placeholder="再次确认密码">
              <div class="eye-wrapper">
                <svg class="eye-icon" viewBox="0 0 24 24"><path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle class="eye-open" cx="12" cy="12" r="3"/><line class="eye-slash" x1="3" y1="3" x2="21" y2="21"/></svg>
              </div>
            </div>
            <div class="input-tips" id="tipPwdConfirm">请与上方设置的密码保持一致</div>
          </div>
          <div class="checkbox-group" style="margin-top: 4px;">
            <input type="checkbox" id="agreeRegister">
            <label for="agreeRegister">我已阅读并同意 <a href="#">《服务条款》</a> 和 <a href="#">《隐私政策》</a></label>
          </div>
          <button type="submit" class="btn-submit" style="margin-bottom: 8px;">注 册</button>
        </form>
      </div>

      <div class="divider">或使用以下方式</div>
      <div class="social-login">
        <button type="button" class="social-btn">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
          GitHub
        </button>
        <button type="button" class="social-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="3" /><path d="M12 12h8" /><path d="M18 12v3" /><path d="M16 15h2" /></svg>
          Passkey
        </button>
      </div>

      <div class="footer-text">
        <div>© 2025 Sleep. All rights reserved. · <a href="#">隐私政策</a> · <a href="#">用户协议</a></div>
      </div>
    </div>
  </div>
  <script>
    // 1. 基础防御
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend', e => e.preventDefault());
    document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', e => { if (e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => { const now = (new Date()).getTime(); if (now - lastTouchEnd <= 300) e.preventDefault(); lastTouchEnd = now; }, false);
    document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    document.addEventListener('contextmenu', e => e.preventDefault());

    // 2. 语言切换
    const languages = [
      { code: 'zh-CN', flag: '🇨🇳', name: '简体中文' }, { code: 'en', flag: '🇺🇸', name: 'English' },
      { code: 'es', flag: '🇪🇸', name: 'Español' }, { code: 'hi', flag: '🇮🇳', name: 'हिन्दी' },
      { code: 'fr', flag: '🇫🇷', name: 'Français' }, { code: 'ar', flag: '🇸🇦', name: 'العربية' },
      { code: 'bn', flag: '🇧🇩', name: 'বাংলা' }, { code: 'pt', flag: '🇵🇹', name: 'Português' },
      { code: 'ru', flag: '🇷🇺', name: 'Русский' }, { code: 'ur', flag: '🇵🇰', name: 'اردو' },
      { code: 'id', flag: '🇮🇩', name: 'Bahasa Indonesia' }, { code: 'de', flag: '🇩🇪', name: 'Deutsch' },
      { code: 'ja', flag: '🇯🇵', name: '日本語' }, { code: 'nl', flag: '🇳🇱', name: 'Nederlands' },
      { code: 'tr', flag: '🇹🇷', name: 'Türkçe' }, { code: 'ko', flag: '🇰🇷', name: '한국어' },
      { code: 'it', flag: '🇮🇹', name: 'Italiano' }, { code: 'th', flag: '🇹🇭', name: 'ไทย' },
      { code: 'vi', flag: '🇻🇳', name: 'Tiếng Việt' }, { code: 'zh-TW', flag: '🇭🇰', name: '繁體中文' },
      { code: 'pl', flag: '🇵🇱', name: 'Polski' }, { code: 'uk', flag: '🇺🇦', name: 'Українська' },
      { code: 'fa', flag: '🇮🇷', name: 'فارسی' }, { code: 'ta', flag: '🇱🇰', name: 'தமிழ்' },
      { code: 'te', flag: '🇮🇳', name: 'తెలుగు' }, { code: 'mr', flag: '🇮🇳', name: 'मराठी' },
      { code: 'kn', flag: '🇮🇳', name: 'ಕನ್ನಡ' }, { code: 'gu', flag: '🇮🇳', name: 'ગુજરાતી' },
      { code: 'ms', flag: '🇲🇾', name: 'Bahasa Melayu' }, { code: 'tl', flag: '🇵🇭', name: 'Filipino' }
    ];
    const langBtn = document.getElementById('langBtn');
    const langMenu = document.getElementById('langMenu');
    languages.forEach(lang => {
      const div = document.createElement('div');
      div.className = 'lang-item';
      div.innerHTML = `<span class="flag">${lang.flag}</span><span class="name">${lang.name}</span>`;
      div.onclick = (e) => { e.stopPropagation(); document.getElementById('currentFlag').textContent = lang.flag; document.getElementById('currentText').textContent = lang.name; langMenu.classList.remove('active'); };
      langMenu.appendChild(div);
    });
    langBtn.onclick = (e) => { e.stopPropagation(); langMenu.classList.toggle('active'); };
    document.addEventListener('click', () => { langMenu.classList.remove('active'); });

    // 3. 密码显隐
    document.querySelectorAll('.eye-wrapper').forEach(wrapper => {
      const input = wrapper.previousElementSibling;
      wrapper.addEventListener('click', (e) => {
        e.preventDefault();
        input.type = input.type === 'password' ? 'text' : 'password';
        wrapper.classList.toggle('show-pwd');
        input.focus();
        const val = input.value; input.value = ''; input.value = val;
      });
    });

    // 4. Tab 切换
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    tabLogin.onclick = () => {
      tabLogin.classList.add('active'); tabRegister.classList.remove('active');
      document.getElementById('loginForm').classList.add('active'); document.getElementById('registerForm').classList.remove('active');
      document.getElementById('pageTitle').textContent = "欢迎回来"; document.getElementById('pageSub').textContent = "登录以继续访问 Sleep 平台";
      clearAllErrors();
    };
    tabRegister.onclick = () => {
      tabRegister.classList.add('active'); tabLogin.classList.remove('active');
      document.getElementById('registerForm').classList.add('active'); document.getElementById('loginForm').classList.remove('active');
      document.getElementById('pageTitle').textContent = "创建账号"; document.getElementById('pageSub').textContent = "加入 Sleep 平台，开启你的专属空间";
      clearAllErrors();
    };

    // 5. 核心错误处理
    const cardContainer = document.getElementById('cardContainer');
    const defaultTips = {
      tipUser: "支持 4-20 位字母、数字或下划线",
      tipEmail: "用于登录、找回密码及接收重要通知",
      tipPwd: "需包含大小写字母、数字及符号，长度 8-20 位",
      tipPwdConfirm: "请与上方设置的密码保持一致"
    };
    const weakPasswords = ['12345678', 'password', '123456789', '11111111', 'abc12345', 'admin123', 'qwertyui'];

    function triggerShake() { cardContainer.classList.remove('shake'); void cardContainer.offsetWidth; cardContainer.classList.add('shake'); }

    function showError(inputEl, tipEl, msg) {
      if (inputEl) inputEl.classList.add('error');
      if (tipEl) { tipEl.textContent = msg; tipEl.style.visibility = "visible"; tipEl.classList.add('error-text'); }
    }

    function clearError(inputEl, tipEl, defaultMsg = "") {
      if (inputEl) inputEl.classList.remove('error');
      if (tipEl) {
        tipEl.classList.remove('error-text');
        if (defaultMsg) { tipEl.textContent = defaultMsg; tipEl.style.color = ""; } else { tipEl.style.visibility = "hidden"; }
      }
    }

    function clearAllErrors() {
      clearError(document.getElementById('loginUser'), document.getElementById('tipLoginUser'));
      clearError(document.getElementById('loginPwd'), document.getElementById('tipLoginPwd'));
      clearError(document.getElementById('regUser'), document.getElementById('tipUser'), defaultTips.tipUser);
      clearError(document.getElementById('regEmail'), document.getElementById('tipEmail'), defaultTips.tipEmail);
      clearError(document.getElementById('regPwd'), document.getElementById('tipPwd'), defaultTips.tipPwd);
      clearError(document.getElementById('regPwdConfirm'), document.getElementById('tipPwdConfirm'), defaultTips.tipPwdConfirm);
      document.querySelectorAll(".checkbox-group").forEach(c => c.classList.remove('error-checkbox'));
    }

    // 6. 失焦校验
    function validateField(inputEl, type) {
      const val = inputEl.value.trim();
      if (!val) return false;
      if (type === 'regUser' && !/^[a-zA-Z0-9_]{4,20}$/.test(val)) { showError(inputEl, document.getElementById('tipUser'), "需 4-20 位字母、数字或下划线"); return false; }
      if (type === 'regEmail' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) { showError(inputEl, document.getElementById('tipEmail'), "邮箱格式不正确"); return false; }
      if (type === 'loginUser') {
        const isEmail = val.includes('@');
        if (isEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) { showError(inputEl, document.getElementById('tipLoginUser'), "邮箱格式不正确"); return false; }
        if (!isEmail && !/^[a-zA-Z0-9_]{4,20}$/.test(val)) { showError(inputEl, document.getElementById('tipLoginUser'), "账号需 4-20 位"); return false; }
      }
      return true;
    }
    document.getElementById('regUser').addEventListener('blur', function() { validateField(this, 'regUser'); });
    document.getElementById('regEmail').addEventListener('blur', function() { validateField(this, 'regEmail'); });
    document.getElementById('loginUser').addEventListener('blur', function() { validateField(this, 'loginUser'); });

    // 7. 超级密码实时诊断
    document.getElementById('regPwd').addEventListener('input', function() {
      const val = this.value;
      const tip = document.getElementById('tipPwd');
      this.classList.remove('error');
      tip.style.color = ""; 
      
      if (!val) { tip.textContent = defaultTips.tipPwd; tip.classList.remove('error-text'); return; }

      if (/\s/.test(val)) { tip.textContent = "密码不能包含空格"; tip.classList.add('error-text'); return; }
      if (weakPasswords.includes(val.toLowerCase())) { tip.textContent = "密码过于简单，请更换"; tip.classList.add('error-text'); return; }
      
      const accountVal = document.getElementById('regUser').value.trim();
      const emailVal = document.getElementById('regEmail').value.trim();
      if (accountVal && val === accountVal) { tip.textContent = "密码不能与账号相同"; tip.classList.add('error-text'); return; }
      if (emailVal && val === emailVal) { tip.textContent = "密码不能与邮箱相同"; tip.classList.add('error-text'); return; }

      let missing = [];
      if (val.length < 8 || val.length > 20) missing.push("8-20位");
      if (!/[a-z]/.test(val)) missing.push("小写字母");
      if (!/[A-Z]/.test(val)) missing.push("大写字母");
      if (!/\d/.test(val)) missing.push("数字");
      if (!/[\W_]/.test(val)) missing.push("特殊符号");

      if (missing.length > 0) {
        tip.textContent = "缺少: " + missing.join("、");
        tip.classList.add('error-text');
      } else {
        tip.textContent = "密码强度合格 ✓";
        tip.classList.remove('error-text');
        tip.style.color = "#38a169";
      }
    });

    document.getElementById('regPwdConfirm').addEventListener('input', function() {
      const pwd = document.getElementById('regPwd').value;
      const tip = document.getElementById('tipPwdConfirm');
      this.classList.remove('error');
      tip.style.color = "";
      
      if (!this.value) { tip.textContent = defaultTips.tipPwdConfirm; tip.classList.remove('error-text'); return; }
      if (this.value !== pwd) {
        tip.textContent = "两次输入的密码不一致"; tip.classList.add('error-text');
      } else {
        tip.textContent = "密码匹配 ✓"; tip.classList.remove('error-text'); tip.style.color = "#38a169";
      }
    });

    document.querySelectorAll("input").forEach(input => {
      input.addEventListener("input", function() {
        this.classList.remove("error");
        const tip = document.getElementById("tip" + this.id.charAt(0).toUpperCase() + this.id.slice(1));
        if (tip && tip.id !== 'tipPwd' && tip.id !== 'tipPwdConfirm') { tip.classList.remove("error-text"); }
        if (this.id === 'loginUser') document.getElementById('tipLoginUser').style.visibility = "hidden";
        if (this.id === 'loginPwd') document.getElementById('tipLoginPwd').style.visibility = "hidden";
      });
      input.addEventListener("change", function() { this.parentElement.classList.remove("error-checkbox"); });
    });

    // 8. 键盘智能定位
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', () => {
        setTimeout(() => { input.scrollIntoView({ block: "center", behavior: "smooth" }); }, 300);
      });
    });

    // 9. 提交全局校验
    function handleFormSubmit(e, type) {
      e.preventDefault();
      clearAllErrors();
      let isValid = true;

      if (type === 'login') {
        const user = document.getElementById('loginUser');
        const pwd = document.getElementById('loginPwd');
        const agree = document.getElementById('agreeLogin');
        
        if (!user.value.trim()) { showError(user, document.getElementById('tipLoginUser'), "请输入账号或邮箱"); isValid = false; }
        else if (!validateField(user, 'loginUser')) { isValid = false; }
        
        if (!pwd.value.trim()) { showError(pwd, document.getElementById('tipLoginPwd'), "请输入密码"); isValid = false; }
        else if (pwd.value.length < 6) { showError(pwd, document.getElementById('tipLoginPwd'), "密码长度不能少于 6 位"); isValid = false; }
        
        if (!agree.checked) { agree.parentElement.classList.add('error-checkbox'); isValid = false; }
      } else {
        const user = document.getElementById('regUser');
        const email = document.getElementById('regEmail');
        const pwd = document.getElementById('regPwd');
        const pwdConfirm = document.getElementById('regPwdConfirm');
        const agree = document.getElementById('agreeRegister');
        
        if (!user.value.trim()) { showError(user, document.getElementById('tipUser'), "账号不能为空"); isValid = false; }
        else if (!validateField(user, 'regUser')) { isValid = false; }
        
        if (!email.value.trim()) { showError(email, document.getElementById('tipEmail'), "邮箱不能为空"); isValid = false; }
        else if (!validateField(email, 'regEmail')) { isValid = false; }
        
        let isPwdValid = true;
        if (/\s/.test(pwd.value)) { showError(pwd, document.getElementById('tipPwd'), "密码不能包含空格"); isPwdValid = false; }
        else if (weakPasswords.includes(pwd.value.toLowerCase())) { showError(pwd, document.getElementById('tipPwd'), "密码过于简单，请更换"); isPwdValid = false; }
        else if (user.value.trim() && pwd.value === user.value.trim()) { showError(pwd, document.getElementById('tipPwd'), "密码不能与账号相同"); isPwdValid = false; }
        else if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,20}$/.test(pwd.value)) { showError(pwd, document.getElementById('tipPwd'), "密码格式不符合要求"); isPwdValid = false; }
        if (!isPwdValid) isValid = false;

        if (!pwdConfirm.value) { showError(pwdConfirm, document.getElementById('tipPwdConfirm'), "请确认密码"); isValid = false; }
        else if (pwdConfirm.value !== pwd.value) { showError(pwdConfirm, document.getElementById('tipPwdConfirm'), "两次输入的密码不一致"); isValid = false; }
        
        if (!agree.checked) { agree.parentElement.classList.add('error-checkbox'); isValid = false; }
      }

      if (!isValid) {
        triggerShake();
        setTimeout(clearAllErrors, 3000);
      } else {
        alert(type === 'login' ? "登录校验通过" : "注册校验通过");
      }
    }

    document.getElementById('formLogin').addEventListener('submit', (e) => handleFormSubmit(e, 'login'));
    document.getElementById('formRegister').addEventListener('submit', (e) => handleFormSubmit(e, 'register'));

  </script>
</body>
